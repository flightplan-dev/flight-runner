# flightplan.yml - App with authentication (better-auth, next-auth, etc.)
# Demonstrates using APP_URL for auth callback URLs

services:
  - postgres:16

env:
  from_file: .env.example
  secrets:
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
  set:
    NODE_ENV: development
    DATABASE_URL: ${POSTGRES_URL}
    # APP_URL is the sprite's public URL, automatically provided by Flightplan
    # Use it for auth callbacks, webhooks, and any URL that needs to be publicly accessible
    BETTER_AUTH_URL: ${APP_URL}
    NEXTAUTH_URL: ${APP_URL}
    # You can also construct derived URLs
    AUTH_CALLBACK_URL: ${APP_URL}/api/auth/callback

setup:
  - npm install
  - npx prisma generate
  - npx prisma migrate deploy

dev_server:
  command: npm run dev
  port: 3000

hints:
  - "APP_URL is the sprite's public URL (e.g., https://mission-xxx.sprites.app)"
  - "Use APP_URL for OAuth callbacks and webhook endpoints"
  - "Run tests with: npm test"
